d\":\"-Pc82iY1\",\"features_advancedtasks.md\":\"DHj27sF0\",\"features_autobattle.md\":\"ZMCtkxH8\",\"features_dailytasks.md\":\"BFK7z4S5\",\"features_homeinterface.md\":\"BKRaE5Cf\",\"features_homeworkshare.md\":\"DBCPOPXS\",\"features_multiinstance.md\":\"D85Xcx68\",\"features_notifications.md\":\"BqKJYXSW\",\"features_recordhomework.md\":\"B9MQjdZo\",\"features_settings.md\":\"W5QM8QT4\",\"index.md\":\"BPvxRD0O\",\"manual_announcementarchive.md\":\"D_AdrvsG\",\"manual_feedback.md\":\"BMA1WYJw\",\"manual_joinus.md\":\"BG7WJ3IA\",\"manual_overview.md\":\"DKvy3DHH\",\"manual_systemsupport.md\":\"C-3gmT-t\",\"started_connectionandupdate.md\":\"BJND9AYd\",\"started_firstlaunch.md\":\"CS_SU6gl\",\"started_install.md\":\"gUsB0hVl\"}");window.__VP_SITE_DATA__=JSON.parse("{\"lang\":\"en-US\",\"dir\":\"ltr\",\"title\":\"MaaYuan 文档站\",\"description\":\"MaaYuan 是代号鸢/如鸢玩家的实用助手，日常、活动、高难关卡直接拿捏，解放双手，畅玩无忧！立即了解如何使用或参与开发 MaaYuan，并查看更多代号鸢/如鸢攻略与实用工具。\",\"base\":\"/\",\"head\":[],\"router\":{\"prefetchLinks\":true},\"appearance\":true,\"themeConfig\":{\"search\":{\"provider\":\"local\",\"options\":{\"locales\":{\"root\":{\"translations\":{\"button\":{\"buttonText\":\"搜索文档\",\"buttonAriaLabel\":\"搜索文档\"},\"modal\":{\"noResultsText\":\"无法找到相关结果\",\"resetButtonTitle\":\"清除查询条件\",\"footer\":{\"selectText\":\"选择\",\"navigateText\":\"切换\",\"closeText\":\"关闭\"}}}}}}}},\"locales\":{\"root\":{\"label\":\"简体中文\",\"lang\":\"zh-CN\",\"themeConfig\":{\"nav\":[{\"component\":\"NavPopoverBadge\",\"props\":{\"badgeText\":\"✨ v2.2.1-beta.1\",\"title\":\"更新渠道 ✨公测版✨\",\"description\":\"v2.2.1-beta.1\",\"sections\":[{\"title\":\"👩🏻‍💻 请递交简历\",\"items\":[\"自动导航+自动筛选简历+面试全通过。直通后5关的成功结局，搬砖办成功结局需要楼主亲自面试。\"]},{\"title\":\"🥂 华堂夜宴\",\"items\":[\"支持自动推故事关卡、扫荡故事，自动领取奖励、每日免费体力以及逐猎扫荡(需先领取射决开启逐猎)。\",\"P.S. 之前在大鸟活动时发布过。主理人进度有限，还未测试逐猎相关内容是否完全适用于小鸟。\"]},{\"title\":\"🏯 据点情报支持快速扫荡\",\"items\":[]}],\"ariaLabel\":\"查看当前项目版本与更新说明\",\"link\":\"/Started/ConnectionAndUpdate#更新设置\"}},{\"text\":\"📢 公告\",\"items\":[{\"component\":\"AnnouncementNavAction\",\"props\":{\"title\":\"内测招募\",\"content\":\"<p>大家好！</p>\\n<p>这里是 MaaYuan 开发团队。目前软件已进入新功能密集迭代阶段，现面向《代号鸢》/《如鸢》玩家公开招募核心内测体验官！如果你满足以下条件，欢迎加入：</p>\\n<ul>\\n<li>✅ 每天有较充足时间，能高频使用 MaaYuan</li>\\n<li>✅ 愿意深度体验新功能，并主动记录使用问题</li>\\n<li>✅ 遇到 Bug 或异常时，愿意提供截图 / 录屏 + 清晰描述</li>\\n<li>✅ 有长期参与反馈的意愿，与项目共同成长</li>\\n</ul>\\n<h2 id=\\\"✨-你将获得\\\" tabindex=\\\"-1\\\">✨ 你将获得 <a class=\\\"header-anchor\\\" href=\\\"#✨-你将获得\\\" aria-label=\\\"Permalink to “✨ 你将获得”\\\">&#8203;</a></h2>\\n<ul>\\n<li>优先体验尚未公开的新功能（如智能作业适配、新版战斗逻辑等）</li>\\n<li>直通开发者的专属反馈通道</li>\\n<li>表现活跃者还将解锁神秘福利：周边盲盒等！</li>\\n</ul>\\n<h2 id=\\\"📥-如何报名\\\" tabindex=\\\"-1\\\">📥 如何报名？ <a class=\\\"header-anchor\\\" href=\\\"#📥-如何报名\\\" aria-label=\\\"Permalink to “📥 如何报名？”\\\">&#8203;</a></h2>\\n<p>如果你可以使用 MaaYuan 内置更新功能，请直接加入交流群：1080267646。</p>\\n<p>并在入群审核中填入以下两个问题的回答：</p>\\n<ol>\\n<li>你的电脑系统是 W / M / 其他</li>\\n<li>你的 Maa 鸢内置更新类型使用的是 G 还是 M</li>\\n</ol>\\n<p>你的每一次反馈，都是 MaaYuan 变得更好的关键！</p>\\n<p>期待与你一起，打造最稳、最聪明的鸢系长草助手 💙</p>\"}},{\"component\":\"AnnouncementNavAction\",\"props\":{\"title\":\"群宣\",\"content\":\"<p>群宣，我们有2K人大群啦\\n经过各种白嫖硬蹭的努力，我们终于取得了2K人大群的资格，不再受限人数到达500就不能修改公告，只能清除潜水人员的情况了（但还是会以年为单位清除长期潜水的群友，如每年6月清理截止本年1月1日前未发言过群友，习惯潜水的群友可以蹲频道，那边不会清理）</p>\\n<p>1️⃣Maa鸢常驻交流群863288153\\n本群为Maa鸢官方群，群里禁止起任何节奏，请和谐友善交流，群内属性复杂，请专注与MaaYuan相关交流，非MaaYuan相关引起纠纷争论，会将双方都移出群。</p>\\n<p>2⃣Maa鸢作业交流群1055262891\\n本群仅限作业制作者加入，需要提供至少2份上传作业站的作业内容供管理员审核。</p>\\n<p>3️⃣Maa鸢活动限时交流群587118812\\n本群仅在大型肉鸽活动因大量新玩家加入时开放玩家交流互助，或发布内测功能需要人员测试时开放反馈维护。其他时间会关闭入口并且全时段禁言。</p>\\n<p>4️⃣Maa鸢程序交流群1060902378\\n本群仅限程序老师加入，欢迎老师们提交更多pr共同建设MaaYuan ！！</p>\"}}]},{\"text\":\"📖 使用手册\",\"items\":[{\"text\":\"快速开始\",\"link\":\"/Started/Install\"},{\"text\":\"关于MaaYuan\",\"link\":\"/Manual/Overview\"},{\"text\":\"功能介绍\",\"link\":\"/Features/HomeInterface\"},{\"text\":\"任务介绍\",\"link\":\"/Activity/Current\"},{\"text\":\"常见问题\",\"link\":\"/FAQ/01-general-issues\"}]},{\"text\":\"🛠️ 开发手册\",\"items\":[{\"text\":\"MaaYuan零基础开发指南\",\"link\":\"/Developer/0.0-MaaYuan零基础开发指南\"
