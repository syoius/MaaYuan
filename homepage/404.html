d\":\"BhBzK_bT\",\"features_advancedtasks.md\":\"C8tIdSjI\",\"features_autobattle.md\":\"Chpbk50y\",\"features_dailytasks.md\":\"C_LLFDST\",\"features_homeinterface.md\":\"hCCnN9dX\",\"features_homeworkshare.md\":\"Dl9FK24D\",\"features_multiinstance.md\":\"BClQWm-_\",\"features_notifications.md\":\"CsEIlrhp\",\"features_recordhomework.md\":\"Dm7Y5_qH\",\"features_settings.md\":\"acyWjlHr\",\"index.md\":\"B5enGcqX\",\"manual_announcementarchive.md\":\"CEUKC8vu\",\"manual_feedback.md\":\"CmjCaYq9\",\"manual_joinus.md\":\"CUziweD4\",\"manual_overview.md\":\"DIYCs-nf\",\"manual_systemsupport.md\":\"BBHfwcCy\",\"started_connectionandupdate.md\":\"BPtm2iB9\",\"started_firstlaunch.md\":\"JmUktQud\",\"started_install.md\":\"CQQKt6jC\"}");window.__VP_SITE_DATA__=JSON.parse("{\"lang\":\"en-US\",\"dir\":\"ltr\",\"title\":\"MaaYuan Docs\",\"description\":\"MaaYuan 文档站\",\"base\":\"/\",\"head\":[],\"router\":{\"prefetchLinks\":true},\"appearance\":true,\"themeConfig\":{\"search\":{\"provider\":\"local\",\"options\":{\"locales\":{\"root\":{\"translations\":{\"button\":{\"buttonText\":\"搜索文档\",\"buttonAriaLabel\":\"搜索文档\"},\"modal\":{\"noResultsText\":\"无法找到相关结果\",\"resetButtonTitle\":\"清除查询条件\",\"footer\":{\"selectText\":\"选择\",\"navigateText\":\"切换\",\"closeText\":\"关闭\"}}}}}}}},\"locales\":{\"root\":{\"label\":\"简体中文\",\"lang\":\"zh-CN\",\"themeConfig\":{\"nav\":[{\"component\":\"NavPopoverBadge\",\"props\":{\"badgeText\":\"✨ v2.1.2-beta.5\",\"title\":\"更新渠道 ✨最新版本✨\",\"description\":\"v2.1.2-beta.5\",\"highlights\":[\"🗿 【去去指哀牢】：统一调整识图模板，防止卡道具弹窗；浅浅适配21层后的推剧情\",\"🔄 【6-24/7-15 相关】：修复单独运行该任务时会触发自动更改队员的bug\",\"💼 【披荆斩棘/夜以继日】：修复自动选择出战队伍无法正常运行的bug；现在可以正确回答法正相关答题了\"],\"ariaLabel\":\"查看当前项目版本与更新说明\",\"link\":\"/Started/ConnectionAndUpdate#更新设置\"}},{\"text\":\"📢 公告\",\"items\":[{\"component\":\"AnnouncementNavAction\",\"props\":{\"title\":\"内测招募\",\"content\":\"<p>大家好！</p>\\n<p>这里是 MaaYuan 开发团队。目前软件已进入新功能密集迭代阶段，现面向《代号鸢》/《如鸢》玩家公开招募核心内测体验官！如果你满足以下条件，欢迎加入：</p>\\n<ul>\\n<li>✅ 每天有较充足时间，能高频使用 MaaYuan</li>\\n<li>✅ 愿意深度体验新功能，并主动记录使用问题</li>\\n<li>✅ 遇到 Bug 或异常时，愿意提供截图 / 录屏 + 清晰描述</li>\\n<li>✅ 有长期参与反馈的意愿，与项目共同成长</li>\\n</ul>\\n<h2 id=\\\"✨-你将获得\\\" tabindex=\\\"-1\\\">✨ 你将获得 <a class=\\\"header-anchor\\\" href=\\\"#✨-你将获得\\\" aria-label=\\\"Permalink to “✨ 你将获得”\\\">&#8203;</a></h2>\\n<ul>\\n<li>优先体验尚未公开的新功能（如智能作业适配、新版战斗逻辑等）</li>\\n<li>直通开发者的专属反馈通道</li>\\n<li>表现活跃者还将解锁神秘福利：周边盲盒等！</li>\\n</ul>\\n<h2 id=\\\"📥-如何报名\\\" tabindex=\\\"-1\\\">📥 如何报名？ <a class=\\\"header-anchor\\\" href=\\\"#📥-如何报名\\\" aria-label=\\\"Permalink to “📥 如何报名？”\\\">&#8203;</a></h2>\\n<p>如果你可以使用 MaaYuan 内置更新功能，请直接加入交流群：1080267646。</p>\\n<p>并在入群审核中填入以下两个问题的回答：</p>\\n<ol>\\n<li>你的电脑系统是 W / M / 其他</li>\\n<li>你的 Maa 鸢内置更新类型使用的是 G 还是 M</li>\\n</ol>\\n<p>你的每一次反馈，都是 MaaYuan 变得更好的关键！</p>\\n<p>期待与你一起，打造最稳、最聪明的鸢系长草助手 💙</p>\"}},{\"component\":\"AnnouncementNavAction\",\"props\":{\"title\":\"群宣\",\"content\":\"<p>群宣，我们有2K人大群啦\\n经过各种白嫖硬蹭的努力，我们终于取得了2K人大群的资格，不再受限人数到达500就不能修改公告，只能清除潜水人员的情况了（但还是会以年为单位清除长期潜水的群友，如每年6月清理截止本年1月1日前未发言过群友，习惯潜水的群友可以蹲频道，那边不会清理）</p>\\n<p>1️⃣Maa鸢常驻交流群863288153\\n本群为Maa鸢官方群，群里禁止起任何节奏，请和谐友善交流，群内属性复杂，请专注与MaaYuan相关交流，非MaaYuan相关引起纠纷争论，会将双方都移出群。</p>\\n<p>2⃣Maa鸢作业交流群1055262891\\n本群仅限作业制作者加入，需要提供至少2份上传作业站的作业内容供管理员审核。</p>\\n<p>3️⃣Maa鸢活动限时交流群587118812\\n本群仅在大型肉鸽活动因大量新玩家加入时开放玩家交流互助，或发布内测功能需要人员测试时开放反馈维护。其他时间会关闭入口并且全时段禁言。</p>\\n<p>4️⃣Maa鸢程序交流群1060902378\\n本群仅限程序老师加入，欢迎老师们提交更多pr共同建设MaaYuan ！！</p>\"}}]},{\"text\":\"📖 使用手册\",\"items\":[{\"text\":\"快速开始\",\"link\":\"/Started/Install\"},{\"text\":\"关于MaaYuan\",\"link\":\"/Manual/Overview\"},{\"text\":\"功能介绍\",\"link\":\"/Features/HomeInterface\"},{\"text\":\"任务介绍\",\"link\":\"/Activity/Current\"},{\"text\":\"常见问题\",\"link\":\"/FAQ/01-general-issues\"}]},{\"text\":\"🛠️ 开发手册\",\"items\":[{\"text\":\"MaaYuan零基础开发指南\",\"link\":\"/Developer/0.0-MaaYuan零基础开发指南\"},{\"text\":\"开发工具介绍\",\"link\":\"/Developer/0.1-开发工具介绍\"},{\"text\":\"MaaYuan开发规范\",\"link\":\"/Developer/1.0-MaaYuan开发规范\"},{\"text\":\"节点信息输出\",\"link\":\"/Developer/1.1-节点信息输出\"},{\"text\":\"int
