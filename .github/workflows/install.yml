name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "agent/**"
      - "android/**"
      - "assets/**"
      - "requirements*.txt"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "agent/**"
      - "android/**"
      - "assets/**"
      - "requirements*.txt"
      - "**.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi
          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi
          is_prerelease=false
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-([Aa]lpha|[Bb]eta|[Rr][Cc])\.[0-9]+$ ]]; then
            is_prerelease=true
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  windows:
    needs: meta
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Embed Python on Windows
        shell: bash
        run: |
          python tools/ci/setup_embed_python.py

      - name: Install
        shell: bash
        run: |
          ./install/python/python.exe ./install4release.py ${{ needs.meta.outputs.tag }}

      - name: Download MFAAvalonia
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: syoius/MFAAvalonia
          fileName: "MFAAvalonia-*-win-${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'arm64') }}*"
          latest: true
          out-file-path: "MFAAvalonia"
          extract: true

      - name: Install MFAAvalonia
        shell: bash
        run: |
          rm -rf MFAAvalonia/resource/base/model
          find MFAAvalonia -name "MFAAvalonia-*.zip" -type f -delete
          cp -r MFAAvalonia/* install

      - uses: actions/upload-artifact@v4
        with:
          name: MaaYuan-win-${{ matrix.arch }}
          path: "install"

  linux:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install on Linux
        shell: bash
        run: |
          python3 ./install4release.py ${{ needs.meta.outputs.tag }}

      - name: Download MFAAvalonia for Linux
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: syoius/MFAAvalonia
          fileName: "MFAAvalonia-*-linux-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}*"
          latest: true
          out-file-path: "MFAAvalonia"
          extract: true

      - name: Install MFAAvalonia
        shell: bash
        run: |
          rm -rf MFAAvalonia/resource/base/model
          find MFAAvalonia -name "MFAAvalonia-*.zip" -type f -delete
          cp -r MFAAvalonia/* install

      - uses: actions/upload-artifact@v4
        with:
          name: MaaYuan-linux-${{ matrix.arch }}
          path: "install"

  macos:
    needs: meta
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Embed Python on macOS
        shell: bash
        run: |
          python3 tools/ci/setup_embed_python.py
          EMBED_PYTHON_PATH="./install/python/bin/python3"
          if [ -f "$EMBED_PYTHON_PATH" ]; then
            echo "Setting execute permission for $EMBED_PYTHON_PATH"
            chmod +x "$EMBED_PYTHON_PATH"
          else
            echo "Warning: Embedded Python executable not found at $EMBED_PYTHON_PATH. Skipping chmod."
          fi

      - name: Install on macOS
        shell: bash
        run: |
          PYTHON_EXECUTABLE="./install/python/bin/python3"
          echo "Using Python executable: $PYTHON_EXECUTABLE for macOS (${{ matrix.arch }})"
          $PYTHON_EXECUTABLE ./install4release.py ${{ needs.meta.outputs.tag }}

      - name: Download MFAAvalonia for macOS
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: syoius/MFAAvalonia
          fileName: "MFAAvalonia-*-osx-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}*"
          latest: true
          out-file-path: "MFAAvalonia"
          extract: true

      - name: Install MFAAvalonia
        shell: bash
        run: |
          rm -rf MFAAvalonia/resource/base/model
          find MFAAvalonia -name "MFAAvalonia-*.zip" -type f -delete
          cp -r MFAAvalonia/* install
          cp ./MFAUpdater install

      - uses: actions/upload-artifact@v4
        with:
          name: MaaYuan-macos-${{ matrix.arch }}
          path: "install"

  build-android:
    name: Build Android (MaaFwApp arm64)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-android-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    env:
      RELEASE_VERSION: ${{ needs.meta.outputs.tag }}
      PYTHONUTF8: '1'

    steps:
      - name: Checkout MaaYuan resources and build scripts
        uses: actions/checkout@v4
        with:
          path: resource-source
          submodules: recursive

      - name: Select signed release or isolated CI build
        id: signing
        env:
          IS_RELEASE: ${{ needs.meta.outputs.is_release }}
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          CERTIFICATE_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          keys = ('KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          supplied = [bool(os.environ.get(key)) for key in keys]
          if any(supplied) and not all(supplied):
              raise SystemExit('Incomplete Android signing secrets; configure all four ANDROID_* secrets.')
          signed = all(supplied)
          if os.environ['IS_RELEASE'] == 'true' and not signed:
              raise SystemExit('Release tags require the permanent Android signing key; refusing a debug-signed release.')
          if signed and not os.environ.get('CERTIFICATE_SHA256'):
              raise SystemExit('Set ANDROID_SIGNING_CERT_SHA256 repository variable before signed builds.')
          if signed:
              path = Path(os.environ['RUNNER_TEMP']) / 'maayuan-release.jks'
              path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
              path.chmod(0o600)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"buildType={'release' if signed else 'debug'}\n")
              output.write(f"task={'assembleRelease' if signed else 'assembleDebug'}\n")
          PY

      - name: Resolve shared version and pinned MaaFwApp source
        id: android
        run: |
          args=()
          if [[ '${{ steps.signing.outputs.buildType }}' == debug ]]; then args+=(--ci); fi
          python3 resource-source/android/prepare.py --metadata-only \
            --version "$RELEASE_VERSION" \
            --version-code "$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"

      - name: Checkout pinned MaaYuan MaaFwApp distribution
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.android.outputs.sourceRepository }}
          ref: ${{ steps.android.outputs.sourceRevision }}
          path: maafw-source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: resource-source/android/requirements.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android toolchain
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' \
            'ndk;${{ steps.android.outputs.ndkVersion }}' 'cmake;3.22.1'
          python -m pip install 'packaging==25.0' 'numpy==2.3.2' 'wheel==0.45.1'

      - name: Test Android packaging rules
        run: python -m unittest discover -s resource-source/android/tests -v

      - name: Prepare resources and profile
        run: |
          args=()
          if [[ '${{ steps.signing.outputs.buildType }}' == debug ]]; then args+=(--ci); fi
          python resource-source/android/prepare.py \
            --version "$RELEASE_VERSION" \
            --version-code '${{ steps.android.outputs.versionCode }}' "${args[@]}"
          printf 'sdk.dir=%s\nbuild.debugAbi=arm64-v8a\nbuild.releaseAbi=arm64-v8a\n' \
            "$ANDROID_HOME" > maafw-source/local.properties

      - name: Download matching native MaaFramework
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python maafw-source/scripts/setup_maa_framework.py \
            --tag '${{ steps.android.outputs.frameworkVersion }}' --abi arm64-v8a

      - name: Restore Python and OpenCV runtime
        id: runtime
        uses: actions/cache@v4
        with:
          path: resource-source/android/.build/agent-dist
          key: maayuan-maafw-agent-v1-${{ runner.os }}-${{ hashFiles('resource-source/android/build-config.json', 'resource-source/android/build_runtime.py', 'resource-source/android/requirements.txt') }}

      - name: Checkout pinned OpenCV source
        if: steps.runtime.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv
          ref: ${{ steps.android.outputs.opencvRevision }}
          path: opencv-source

      - name: Build Android Python Agent and OpenCV
        if: steps.runtime.outputs.cache-hit != 'true'
        run: |
          python resource-source/android/build_runtime.py \
            --shell-source maafw-source --opencv-source opencv-source

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build MaaYuan APK
        working-directory: maafw-source
        env:
          BUILD_VERSION_NAME: ${{ needs.meta.outputs.tag }}
          BUILD_VERSION_CODE: ${{ steps.android.outputs.versionCode }}
          GITHUB_UPDATE_ASSET_PREFIX: ${{ steps.android.outputs.assetPrefix }}
          PI_PROFILE: ${{ github.workspace }}/resource-source/android/.build/profile.yaml
          KEYSTORE_PATH: ${{ steps.signing.outputs.buildType == 'release' && format('{0}/maayuan-release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:testDebugUnitTest ':app:${{ steps.signing.outputs.task }}'

      - name: Verify APK version, signature, resources and Agent
        env:
          CERTIFICATE_SHA256: ${{ steps.signing.outputs.buildType == 'release' && vars.ANDROID_SIGNING_CERT_SHA256 || '' }}
        run: |
          python resource-source/android/verify_apk.py \
            'maafw-source/app/build/outputs/apk/${{ steps.signing.outputs.buildType }}/app-${{ steps.signing.outputs.buildType }}.apk' \
            --output android-artifacts --certificate-sha256 "$CERTIFICATE_SHA256"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MaaYuan-android-arm64
          path: android-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android test reports and release mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-reports
          path: |
            maafw-source/app/build/reports/tests/
            maafw-source/app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/maayuan-release.jks"


  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, windows, linux, macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MaaYuan-*
          path: assets

      - name: Process and package artifacts
        run: |
          cd assets
          for f in *; do
            if compgen -G "$f/*.apk" > /dev/null; then
              mv "$f"/*.apk "$f"/*.apk.sha256 .
              rm -rf "$f"
            elif [[ $f == *"win"* ]]; then
              (cd $f && zip -r ../$f-${{ needs.meta.outputs.tag }}.zip .)
            else
              echo "Processing Unix artifact: $f"

              # 为主要可执行文件设置权限
              if [[ -f "$f/MaaPiCli" ]]; then
                chmod +x $f/MaaPiCli
                echo "Set execute permission for $f/MaaPiCli"
              fi

              if [[ -f "$f/MaaYuan" ]]; then
                chmod +x $f/MaaYuan
                echo "Set execute permission for $f/MaaYuan"
              fi

              # 为Python解释器设置执行权限 (处理不同可能的路径)
              PYTHON_PATHS=(
                "$f/python/bin/python3"
                "$f/python/python"
                "$f/python/bin/python"
                "$f/python/python.exe"
              )
              for PYTHON_PATH in "${PYTHON_PATHS[@]}"; do
                if [[ -f "$PYTHON_PATH" ]]; then
                  chmod +x "$PYTHON_PATH"
                  echo "Set execute permission for $PYTHON_PATH"
                fi
              done

              # macOS 依赖安装脚本保持可执行
              if [[ -f "$f/install-deps-mac.sh" ]]; then
                chmod +x "$f/install-deps-mac.sh"
                echo "Set execute permission for $f/install-deps-mac.sh"
              fi

              # 使用带有'p'标志的tar命令来保留权限
              tar -cpzf $f-${{ needs.meta.outputs.tag }}.tar.gz -C $f .
              echo "Created archive with preserved permissions: $f-${{ needs.meta.outputs.tag }}.tar.gz"
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

      - name: Trigger Downstream Workflows
        if: success()
        run: |
          echo "Triggering MirrorChyan workflows..."
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
