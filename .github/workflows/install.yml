name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "agent/**"
      - "android/**"
      - "assets/**"
      - "requirements*.txt"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "agent/**"
      - "android/**"
      - "assets/**"
      - "requirements*.txt"
      - "**.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi
          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi
          is_prerelease=false
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-([Aa]lpha)\.[0-9]+$ ]]; then
            is_prerelease=true
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  windows:
    needs: meta
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Embed Python on Windows
        shell: bash
        run: |
          python tools/ci/setup_embed_python.py

      - name: Install
        shell: bash
        run: |
          ./install/python/python.exe ./install4release.py ${{ needs.meta.outputs.tag }}

      - name: Download MFAAvalonia
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: syoius/MFAAvalonia
          fileName: "MFAAvalonia-*-win-${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'arm64') }}*"
          latest: true
          out-file-path: "MFAAvalonia"
          extract: true

      - name: Install MFAAvalonia
        shell: bash
        run: |
          rm -rf MFAAvalonia/resource/base/model
          find MFAAvalonia -name "MFAAvalonia-*.zip" -type f -delete
          cp -r MFAAvalonia/* install

      - uses: actions/upload-artifact@v4
        with:
          name: MaaYuan-win-${{ matrix.arch }}
          path: "install"

  linux:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install on Linux
        shell: bash
        run: |
          python3 ./install4release.py ${{ needs.meta.outputs.tag }}

      - name: Download MFAAvalonia for Linux
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: syoius/MFAAvalonia
          fileName: "MFAAvalonia-*-linux-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}*"
          latest: true
          out-file-path: "MFAAvalonia"
          extract: true

      - name: Install MFAAvalonia
        shell: bash
        run: |
          rm -rf MFAAvalonia/resource/base/model
          find MFAAvalonia -name "MFAAvalonia-*.zip" -type f -delete
          cp -r MFAAvalonia/* install

      - uses: actions/upload-artifact@v4
        with:
          name: MaaYuan-linux-${{ matrix.arch }}
          path: "install"

  macos:
    needs: meta
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Embed Python on macOS
        shell: bash
        run: |
          python3 tools/ci/setup_embed_python.py
          EMBED_PYTHON_PATH="./install/python/bin/python3"
          if [ -f "$EMBED_PYTHON_PATH" ]; then
            echo "Setting execute permission for $EMBED_PYTHON_PATH"
            chmod +x "$EMBED_PYTHON_PATH"
          else
            echo "Warning: Embedded Python executable not found at $EMBED_PYTHON_PATH. Skipping chmod."
          fi

      - name: Install on macOS
        shell: bash
        run: |
          PYTHON_EXECUTABLE="./install/python/bin/python3"
          echo "Using Python executable: $PYTHON_EXECUTABLE for macOS (${{ matrix.arch }})"
          $PYTHON_EXECUTABLE ./install4release.py ${{ needs.meta.outputs.tag }}

      - name: Download MFAAvalonia for macOS
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: syoius/MFAAvalonia
          fileName: "MFAAvalonia-*-osx-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}*"
          latest: true
          out-file-path: "MFAAvalonia"
          extract: true

      - name: Install MFAAvalonia
        shell: bash
        run: |
          rm -rf MFAAvalonia/resource/base/model
          find MFAAvalonia -name "MFAAvalonia-*.zip" -type f -delete
          cp -r MFAAvalonia/* install
          cp ./MFAUpdater install

      - uses: actions/upload-artifact@v4
        with:
          name: MaaYuan-macos-${{ matrix.arch }}
          path: "install"

  build-android:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: android-arm64
            abi: arm64-v8a
            arch: arm64

    env:
      MFA_ANDROID_MFA_REPOSITORY: MaaXYZ/MFAAvalonia
      MFA_ANDROID_MFA_REF: 1f1f42d03eec1a15ad8cd996180fe0edeb75c1f9
      MAAFW_BINDING_REF: v5.10.0
      MAAFW_BINDING_VERSION: 5.10.0
      MAAFW_NATIVE_VERSION: 5.12.3
      P4A_REF: v2026.05.09
      P4A_ENTRYPOINT: agent/main.py
      P4A_NDK_VERSION: 28.2.13676358
      P4A_ANDROID_API: '36'
      P4A_NDK_API: '26'
      P4A_BOOTSTRAP: service_library
      P4A_PYTHON_VERSION: 3.14.2
      P4A_RUNTIME_CACHE_REV: '1'
      MFA_ANDROID_VIRTUAL_WIDTH: '720'
      MFA_ANDROID_VIRTUAL_HEIGHT: '1280'

    steps:
      - name: Checkout resource project
        uses: actions/checkout@v5
        with:
          path: resource-source
          submodules: recursive

      - name: Checkout pinned MFA Android shell
        uses: actions/checkout@v5
        with:
          repository: ${{ env.MFA_ANDROID_MFA_REPOSITORY }}
          ref: ${{ env.MFA_ANDROID_MFA_REF }}
          path: mfa-source

      - name: Checkout matching MaaFramework Python binding
        uses: actions/checkout@v5
        with:
          repository: MaaXYZ/MaaFramework
          ref: ${{ env.MAAFW_BINDING_REF }}
          path: maafw-python-source
          sparse-checkout: source/binding/Python/maa

      - name: Configure MFA Android virtual display for portrait resources
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          width = int(os.environ["MFA_ANDROID_VIRTUAL_WIDTH"])
          height = int(os.environ["MFA_ANDROID_VIRTUAL_HEIGHT"])
          if (width, height) != (720, 1280):
              raise SystemExit(
                  f"[ERR] MaaYuan Android resources require 720x1280, got {width}x{height}"
              )

          path = Path(
              "mfa-source/MFAAvalonia.Android/AndroidNativeControllerProvider.cs"
          )
          text = path.read_text(encoding="utf-8")
          marker = (
              "        // The controller targets landscape games. Some Android hosts keep MFA's activity in\n"
              "        // portrait and do not auto-rotate virtual displays, so activity metrics cannot be used\n"
              "        // verbatim here without Android letterboxing the game into a thin horizontal strip.\n"
              "        var virtualWidth = Math.Max(metrics.WidthPixels, metrics.HeightPixels);\n"
              "        var virtualHeight = Math.Min(metrics.WidthPixels, metrics.HeightPixels);\n"
          )
          replacement = (
              "        // MaaYuan's recognition resources use a fixed 9:16 portrait canvas.\n"
              f"        const int virtualWidth = {width};\n"
              f"        const int virtualHeight = {height};\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("[ERR] MFA Android virtual-display marker changed")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY

          provider=mfa-source/MFAAvalonia.Android/AndroidNativeControllerProvider.cs
          grep -Fq "const int virtualWidth = $MFA_ANDROID_VIRTUAL_WIDTH;" "$provider"
          grep -Fq "const int virtualHeight = $MFA_ANDROID_VIRTUAL_HEIGHT;" "$provider"

      - name: Verify Agent and MaaFramework version contract
        shell: bash
        run: |
          test -f resource-source/agent/main.py
          grep -Fq \
            '<PackageReference Include="Maa.Framework" Version="5.10.0"' \
            mfa-source/MFAAvalonia/MFAAvalonia.csproj
          grep -Fq \
            '<PackageReference Include="Maa.Framework.Runtime.android-arm64" Version="5.12.3"' \
            mfa-source/MFAAvalonia.Android/MFAAvalonia.Android.csproj
          grep -Fq \
            '<PackageReference Include="Maa.Framework.Runtime.android-x64" Version="5.12.3"' \
            mfa-source/MFAAvalonia.Android/MFAAvalonia.Android.csproj
          test -f maafw-python-source/source/binding/Python/maa/agent/agent_server.py
          test "$(git -C mfa-source rev-parse HEAD)" = "$MFA_ANDROID_MFA_REF"
          test "$(git -C maafw-python-source describe --tags --exact-match)" = "$MAAFW_BINDING_REF"

      - name: Prepare MaaYuan Android payload
        id: payload
        shell: bash
        run: |
          python3 resource-source/configure.py

          payload_root="$RUNNER_TEMP/mfa-android-resource-payload-${{ matrix.arch }}"
          mkdir -p "$payload_root"

          test -f resource-source/assets/interface.json
          cp -a resource-source/assets/interface.json "$payload_root/interface.json"
          cp -a resource-source/assets/resource "$payload_root/resource"
          rsync -a \
            --exclude='tests/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            resource-source/agent/ "$payload_root/agent/"

          for root_file in CONTACT LICENSE README.md requirements.txt requirements-android.txt; do
            test -f "resource-source/$root_file"
            cp -a "resource-source/$root_file" "$payload_root/$root_file"
          done

          mkdir -p "$payload_root/python"
          cp -a maafw-python-source/source/binding/Python/maa "$payload_root/python/maa"

          PAYLOAD_ROOT="$payload_root" P4A_ENTRYPOINT="$P4A_ENTRYPOINT" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PAYLOAD_ROOT"])

          # Android's virtual-display launcher can resolve the installed launcher
          # activity from a package name. Avoid baking desktop-oriented component
          # names into the Android payload, since game updates may change activities.
          android_start_apps = []
          for pipeline_path in sorted(
              root.glob("resource/*/pipeline/start_up.json")
          ):
              pipeline = json.loads(pipeline_path.read_text(encoding="utf-8-sig"))
              changed = False
              for node_name, node in pipeline.items():
                  if not isinstance(node, dict):
                      continue
                  action = node.get("action")
                  if not isinstance(action, dict) or action.get("type") != "StartApp":
                      continue
                  param = action.get("param")
                  if not isinstance(param, dict):
                      raise SystemExit(
                          f"[ERR] StartApp param is invalid: {pipeline_path}:{node_name}"
                      )
                  target = param.get("package")
                  if not isinstance(target, str) or not target.strip():
                      raise SystemExit(
                          f"[ERR] StartApp package is invalid: {pipeline_path}:{node_name}"
                      )
                  package_name = target.split("/", 1)[0].strip()
                  if not package_name or "/" in package_name:
                      raise SystemExit(f"[ERR] Cannot normalize StartApp target: {target}")
                  if target != package_name:
                      param["package"] = package_name
                      changed = True
                  if node.get("max_hit") != 1:
                      node["max_hit"] = 1
                      changed = True
                  android_start_apps.append(
                      f"{pipeline_path.relative_to(root)}:{node_name}={package_name}"
                  )
              if changed:
                  pipeline_path.write_text(
                      json.dumps(pipeline, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )

          if not android_start_apps:
              raise SystemExit("[ERR] Android payload does not contain any StartApp nodes")
          print("Normalized single-hit Android StartApp targets:")
          print("\n".join(android_start_apps))

          interface_path = root / "interface.json"
          value = json.loads(interface_path.read_text(encoding="utf-8-sig"))

          if not isinstance(value.get("agent"), dict):
              raise SystemExit("[ERR] Android interface must declare the Python Agent")
          entrypoint = root / os.environ["P4A_ENTRYPOINT"]
          if not entrypoint.is_file():
              raise SystemExit(f"[ERR] Android Agent entrypoint is missing: {entrypoint}")

          required_root_files = (value.get("contact"), value.get("license"))
          for relative in required_root_files:
              if relative and not (root / relative).is_file():
                  raise SystemExit(f"[ERR] interface root reference is missing: {relative}")

          for resource in value.get("resource", []):
              paths = resource.get("path", [])
              if isinstance(paths, str):
                  paths = [paths]
              for relative in paths:
                  target = root / relative.removeprefix("./")
                  if not target.is_dir():
                      raise SystemExit(f"[ERR] interface resource path is missing: {relative}")

          def strings(node):
              if isinstance(node, dict):
                  for item in node.values():
                      yield from strings(item)
              elif isinstance(node, list):
                  for item in node:
                      yield from strings(item)
              elif isinstance(node, str):
                  yield node

          for relative in sorted({s for s in strings(value) if s.startswith("./resource/")}):
              if not (root / relative.removeprefix("./")).exists():
                  raise SystemExit(f"[ERR] interface resource reference is missing: {relative}")

          for required in (
              "resource/base/pipeline",
              "resource/base/image",
              "resource/base/model/ocr",
              "resource/zh_tw/pipeline",
              "resource/zh_tw/image",
              "resource/zh_tw/model/ocr",
              "python/maa/agent/agent_server.py",
          ):
              if not (root / required).exists():
                  raise SystemExit(f"[ERR] required Android payload path is missing: {required}")
          PY

          if find "$payload_root" \
            \( -type d \( -iname bin -o -iname obj -o -iname Debug -o -iname .venv -o -iname __pycache__ \) \
            -o -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.pyd' \
              -o -iname '*.pyc' -o -iname '*.pyo' -o -iname '*.keystore' \
              -o -iname '*.jks' -o -iname '*.pfx' -o -iname '*.log' \) \) \
            -print -quit | grep -q .; then
            echo "[ERR] Android payload contains a forbidden local/build/signing/log file"
            exit 1
          fi

          echo "root=$payload_root" >> "$GITHUB_OUTPUT"

      - name: Resolve APK metadata
        id: metadata
        shell: bash
        run: |
          echo "application_id=io.github.syoius.maayuan" >> "$GITHUB_OUTPUT"
          echo "output_name=MaaYuan-${{ needs.meta.outputs.tag }}-android-${{ matrix.arch }}.apk" >> "$GITHUB_OUTPUT"
          echo "artifact_name=MaaYuan-android-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Prepare Android Python service adapter
        id: p4a_adapter
        shell: bash
        run: |
          private_root="$RUNNER_TEMP/mfa-p4a-private-${{ matrix.arch }}"
          mkdir -p "$private_root"
          cp mfa-source/workflows/android/mfa_android_agent.py \
            "$private_root/mfa_android_agent.py"

          # MFA's adapter exposes the Android native directory as MAA_LIBRARY_DIR,
          # while MaaFramework's Python binding reads MAAFW_BINARY_PATH during its
          # eager package import. Set the binding variable before the preload import.
          python3 - "$private_root/mfa_android_agent.py" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = '        os.environ["MAA_LIBRARY_DIR"] = native_library_dir\n'
          replacement = marker + '        os.environ["MAAFW_BINARY_PATH"] = native_library_dir\n'
          if text.count(marker) != 1:
              raise SystemExit("[ERR] MFA Android Agent native-library marker changed")
          if 'os.environ["MAAFW_BINARY_PATH"]' in text:
              raise SystemExit("[ERR] MFA Android Agent already configures MAAFW_BINARY_PATH")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
          grep -Fq 'os.environ["MAAFW_BINARY_PATH"] = native_library_dir' \
            "$private_root/mfa_android_agent.py"

          echo "root=$private_root" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$private_root/mfa_android_agent.py" | cut -d ' ' -f 1)" \
            >> "$GITHUB_OUTPUT"

      - name: Restore cached python-for-android runtime AAR
        id: p4a_aar_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mfa-p4a-aar-cache-${{ matrix.arch }}
          key: mfa-p4a-aar-v${{ env.P4A_RUNTIME_CACHE_REV }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.abi }}-p4a-${{ env.P4A_REF }}-python-${{ env.P4A_PYTHON_VERSION }}-ndk-${{ env.P4A_NDK_VERSION }}-api-${{ env.P4A_ANDROID_API }}-${{ env.P4A_NDK_API }}-bootstrap-${{ env.P4A_BOOTSTRAP }}-requirements-${{ hashFiles('resource-source/requirements-android.txt') }}-adapter-${{ steps.p4a_adapter.outputs.sha256 }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and build tools
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Android NDK for P4A cache miss
        if: steps.p4a_aar_cache.outputs.cache-hit != 'true'
        shell: bash
        run: sdkmanager "ndk;$P4A_NDK_VERSION"

      - name: Setup build Python
        if: steps.p4a_aar_cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python-for-android host dependencies
        if: steps.p4a_aar_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint ccache cmake gettext libffi-dev libltdl-dev \
            libssl-dev libtool openjdk-17-jdk patch pkg-config unzip zip
          python -m pip install --upgrade pip wheel setuptools
          git clone --depth 1 --branch "$P4A_REF" \
            https://github.com/kivy/python-for-android.git \
            "$RUNNER_TEMP/python-for-android"
          for recipe in python3 numpy opencv Pillow; do
            test -d "$RUNNER_TEMP/python-for-android/pythonforandroid/recipes/$recipe"
          done
          grep -Fq "version = '3.14.2'" \
            "$RUNNER_TEMP/python-for-android/pythonforandroid/recipes/python3/__init__.py"
          grep -Fq 'version = "v2.3.0"' \
            "$RUNNER_TEMP/python-for-android/pythonforandroid/recipes/numpy/__init__.py"
          grep -Fq "version = '4.12.0'" \
            "$RUNNER_TEMP/python-for-android/pythonforandroid/recipes/opencv/__init__.py"
          grep -Fq "version = '11.3.0'" \
            "$RUNNER_TEMP/python-for-android/pythonforandroid/recipes/Pillow/__init__.py"
          python -m pip install --editable "$RUNNER_TEMP/python-for-android"

      - name: Build python-for-android service AAR
        if: steps.p4a_aar_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ANDROIDSDK: ${{ env.ANDROID_HOME }}
          ANDROIDNDK: ${{ env.ANDROID_HOME }}/ndk/${{ env.P4A_NDK_VERSION }}
          ANDROIDAPI: ${{ env.P4A_ANDROID_API }}
          NDKAPI: ${{ env.P4A_NDK_API }}
          PAYLOAD_ROOT: ${{ steps.payload.outputs.root }}
        run: |
          private_root="${{ steps.p4a_adapter.outputs.root }}"
          test -f "$private_root/mfa_android_agent.py"

          effective_requirements=$(python - "$PAYLOAD_ROOT/requirements-android.txt" <<'PY'
          import sys
          from pathlib import Path

          values = []
          for raw in Path(sys.argv[1]).read_text(encoding="utf-8-sig").splitlines():
              value = raw.strip()
              if value and not value.startswith("#"):
                  if value.startswith("-"):
                      raise SystemExit(f"[ERR] unsupported Android requirement: {value}")
                  values.append(value)
          print(",".join(values))
          PY
          )
          echo "[INF] python-for-android requirements: $effective_requirements"

          build_root="$RUNNER_TEMP/mfa-p4a-build-${{ matrix.arch }}"
          mkdir -p "$build_root"
          cd "$build_root"
          p4a aar \
            --dist-name mfa_android_python \
            --private "$private_root" \
            --package com.fox.mfa.python \
            --name MFAAndroidPythonAgent \
            --version 1.0 \
            --bootstrap "$P4A_BOOTSTRAP" \
            --requirements "$effective_requirements" \
            --service mfaagent:mfa_android_agent.py \
            --arch "${{ matrix.abi }}" \
            --android-api "$P4A_ANDROID_API" \
            --ndk-api "$P4A_NDK_API" \
            --release

          aar_path=$(find "$build_root" -type f -name '*.aar' -print -quit)
          test -n "$aar_path"

          aar_manifest_dir="$RUNNER_TEMP/mfa-python-aar-manifest-${{ matrix.arch }}"
          mkdir -p "$aar_manifest_dir"
          unzip -q "$aar_path" AndroidManifest.xml -d "$aar_manifest_dir"
          python - "$aar_manifest_dir/AndroidManifest.xml" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = 'android:process=":service_mfaagent"'
          replacement = marker + '\n            android:foregroundServiceType="dataSync"'
          if 'android:foregroundServiceType=' not in text:
              if marker not in text:
                  raise SystemExit("[ERR] P4A Agent service is missing from the AAR manifest")
              path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
          (cd "$aar_manifest_dir" && zip -q -u "$aar_path" AndroidManifest.xml)

          cache_dir="$RUNNER_TEMP/mfa-p4a-aar-cache-${{ matrix.arch }}"
          mkdir -p "$cache_dir"
          cp "$aar_path" "$cache_dir/mfa_android_python.aar"

      - name: Verify cached or built python-for-android runtime AAR
        id: python_runtime
        shell: bash
        run: |
          aar_path="$RUNNER_TEMP/mfa-p4a-aar-cache-${{ matrix.arch }}/mfa_android_python.aar"
          test -s "$aar_path"
          aar_entries="$RUNNER_TEMP/p4a-aar-entries-${{ matrix.arch }}.txt"
          unzip -Z1 "$aar_path" > "$aar_entries"
          grep -Fxq "jni/${{ matrix.abi }}/libpython3.14.so" "$aar_entries"
          manifest_text=$(unzip -p "$aar_path" AndroidManifest.xml)
          grep -Fq 'android:process=":service_mfaagent"' <<< "$manifest_text"
          grep -Fq 'android:foregroundServiceType="dataSync"' <<< "$manifest_text"
          echo "aar=$aar_path" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          config-file: mfa-source/NuGet.config

      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore MFA Android dependencies
        shell: bash
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        working-directory: mfa-source
        run: |
          dotnet restore MFAAvalonia.Android/MFAAvalonia.Android.csproj \
            -r "${{ matrix.rid }}" \
            -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Build APK with interface, resources and Python Agent
        shell: bash
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
          PAYLOAD_ROOT: ${{ steps.payload.outputs.root }}
          PYTHON_AAR: ${{ steps.python_runtime.outputs.aar }}
          APPLICATION_ID: ${{ steps.metadata.outputs.application_id }}
        working-directory: mfa-source
        run: |
          test -n "$PYTHON_AAR"
          dotnet publish MFAAvalonia.Android/MFAAvalonia.Android.csproj \
            -c Release \
            -f net10.0-android \
            -r "${{ matrix.rid }}" \
            --no-restore \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:AndroidEmbedResourcePackage=true \
            "-p:ApplicationId=$APPLICATION_ID" \
            "-p:AndroidResourcePackageSource=$PAYLOAD_ROOT" \
            "-p:AndroidLauncherLabel=Maa鸢" \
            "-p:AndroidPythonRuntimeAar=$PYTHON_AAR" \
            "-p:AndroidPythonAgentEntryPoint=$P4A_ENTRYPOINT"

      - name: Verify and collect Android APK
        id: apk
        shell: bash
        env:
          OUTPUT_NAME: ${{ steps.metadata.outputs.output_name }}
          EXPECTED_APPLICATION_ID: ${{ steps.metadata.outputs.application_id }}
        run: |
          publish_dir="mfa-source/MFAAvalonia.Android/bin/Release/net10.0-android/${{ matrix.rid }}/publish"
          apk_path=$(find "$publish_dir" -maxdepth 1 -type f -name '*-Signed.apk' -print -quit)
          test -n "$apk_path"

          apk_entries="$RUNNER_TEMP/mfa-resource-apk-${{ matrix.arch }}-entries.txt"
          unzip -Z1 "$apk_path" > "$apk_entries"
          apk_badging="$RUNNER_TEMP/mfa-resource-apk-${{ matrix.arch }}-badging.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk_path" > "$apk_badging"
          actual_application_id=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$apk_badging")
          test "$actual_application_id" = "$EXPECTED_APPLICATION_ID"

          grep -Fxq 'assets/MfaPackage/package.zip' "$apk_entries"
          grep -Fxq 'assets/MfaDependencies/shizuku.apk' "$apk_entries"
          grep -Fxq "lib/${{ matrix.abi }}/libMaaFramework.so" "$apk_entries"
          grep -Fxq "lib/${{ matrix.abi }}/libMaaAgentServer.so" "$apk_entries"
          grep -Eq "^lib/${{ matrix.abi }}/libpython3\.[0-9]+\.so$" "$apk_entries"

          package_zip="$RUNNER_TEMP/mfa-package-${{ matrix.arch }}.zip"
          unzip -p "$apk_path" assets/MfaPackage/package.zip > "$package_zip"
          package_entries="$RUNNER_TEMP/mfa-package-${{ matrix.arch }}-entries.txt"
          unzip -Z1 "$package_zip" > "$package_entries"
          grep -Fxq 'interface.json' "$package_entries"
          grep -Fxq 'agent/main.py' "$package_entries"
          grep -Fxq 'python/maa/agent/agent_server.py' "$package_entries"
          grep -Eq '^resource/base/(pipeline|image|model)/' "$package_entries"
          grep -Eq '^resource/zh_tw/(pipeline|image|model)/' "$package_entries"
          if grep -Ei '(^|/)(bin|obj|Debug|\.venv|__pycache__)/|\.(exe|dll|pyd|pyc|pyo|keystore|jks|pfx|log)$' \
            "$package_entries"; then
            echo "[ERR] APK payload contains a forbidden local/build/signing/log file"
            exit 1
          fi

          merged_manifest="$RUNNER_TEMP/mfa-resource-apk-${{ matrix.arch }}-manifest.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree \
            --file AndroidManifest.xml "$apk_path" > "$merged_manifest"
          grep -Eq 'foregroundServiceType.*(dataSync|0x0*1([^0-9a-fA-F]|$))' \
            "$merged_manifest"

          output_dir="$GITHUB_WORKSPACE/android-artifacts"
          mkdir -p "$output_dir"
          cp "$apk_path" "$output_dir/$OUTPUT_NAME"
          echo "path=$output_dir/$OUTPUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Save python-for-android runtime AAR cache
        if: >-
          steps.p4a_aar_cache.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mfa-p4a-aar-cache-${{ matrix.arch }}
          key: ${{ steps.p4a_aar_cache.outputs.cache-primary-key }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, windows, linux, macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Process and package artifacts
        run: |
          cd assets
          for f in *; do
            if compgen -G "$f/*.apk" > /dev/null; then
              mv "$f"/*.apk .
              rm -rf "$f"
            elif [[ $f == *"win"* ]]; then
              (cd $f && zip -r ../$f-${{ needs.meta.outputs.tag }}.zip .)
            else
              echo "Processing Unix artifact: $f"

              # 为主要可执行文件设置权限
              if [[ -f "$f/MaaPiCli" ]]; then
                chmod +x $f/MaaPiCli
                echo "Set execute permission for $f/MaaPiCli"
              fi

              if [[ -f "$f/MaaYuan" ]]; then
                chmod +x $f/MaaYuan
                echo "Set execute permission for $f/MaaYuan"
              fi

              # 为Python解释器设置执行权限 (处理不同可能的路径)
              PYTHON_PATHS=(
                "$f/python/bin/python3"
                "$f/python/python"
                "$f/python/bin/python"
                "$f/python/python.exe"
              )
              for PYTHON_PATH in "${PYTHON_PATHS[@]}"; do
                if [[ -f "$PYTHON_PATH" ]]; then
                  chmod +x "$PYTHON_PATH"
                  echo "Set execute permission for $PYTHON_PATH"
                fi
              done

              # macOS 依赖安装脚本保持可执行
              if [[ -f "$f/install-deps-mac.sh" ]]; then
                chmod +x "$f/install-deps-mac.sh"
                echo "Set execute permission for $f/install-deps-mac.sh"
              fi

              # 使用带有'p'标志的tar命令来保留权限
              tar -cpzf $f-${{ needs.meta.outputs.tag }}.tar.gz -C $f .
              echo "Created archive with preserved permissions: $f-${{ needs.meta.outputs.tag }}.tar.gz"
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

      - name: Trigger Downstream Workflows
        if: success()
        run: |
          echo "Triggering MirrorChyan workflows..."
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
