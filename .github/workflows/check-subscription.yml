name: subscription

on:
  push:
    paths:
      - ".github/workflows/check-subscription.yml"
      - "assets/interface*.json"
      - "assets/resource/**/pipeline/daily/subscription.json"
      - "tools/pipeline/tests/test_subscription.py"
  pull_request:
    paths:
      - ".github/workflows/check-subscription.yml"
      - "assets/interface*.json"
      - "assets/resource/**/pipeline/daily/subscription.json"
      - "tools/pipeline/tests/test_subscription.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python -m pip install --upgrade maafw numpy
      - name: Replay monthly-card collection
        run: python -m unittest discover -s tools/pipeline/tests -p "test_subscription.py" -v
